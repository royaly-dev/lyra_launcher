name: Build Release
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-app:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 24.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Debug platform
        run: |
          node -e "console.log('platform:', process.platform)"
          node -e "const { MakerDeb } = require('@electron-forge/maker-deb'); const m = new MakerDeb({}); console.log('deb platforms:', m.platforms)"
        shell: bash

      - name: Install RPM
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
        shell: bash

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
        shell: bash
