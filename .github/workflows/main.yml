name: Build Release
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-app:
    if: contains(github.event.head_commit.message, 'release')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v1

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 24.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Install RPM
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
        shell: bash

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
        shell: bash
